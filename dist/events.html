<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101212">
  <meta name="description" content="The No Code Society events photo gallery.">
  <title>Events | No Code Society</title>
  <link rel="icon" type="image/png" href="assets/no-code-society-logo.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="about.js"></script>
  <script type="module" src="events.js"></script>
</head>
<body>
  <header class="header">
    <a class="wordmark" href="./" aria-label="No Code Society home"><img class="brand-logo" src="assets/no-code-society-logo.png" alt="" width="72" height="72"> NCS</a>
    <span class="header-caption">NO CODE SOCIETY</span>
    <nav class="header-nav" aria-label="Main navigation">
      <a class="nav-link" href="contact.html">Contact us</a>
      <a class="nav-link" href="events.html" aria-current="page">Events</a>
      <button class="about-trigger" id="about-open">About NCS <span aria-hidden="true">↗</span></button>
    </nav>
  </header>
  <main class="events-page">
    <div class="events-intro">
      <h1>Events</h1>
      <p id="gallery-note">A space for moments from No Code Society.<br>Sample images for now. Event photos coming soon.</p>
    </div>
    <section class="events-gallery" aria-label="Events photo gallery" aria-describedby="gallery-note">
      <figure class="event-photo">
        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" alt="Placeholder photo: a warmly lit event space with tables set for guests" width="1400" height="1050" fetchpriority="high" decoding="async">
      </figure>
      <figure class="event-photo">
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" alt="Placeholder photo: people collaborating around a laptop" width="1400" height="1050" loading="lazy" decoding="async">
      </figure>
      <figure class="event-photo">
        <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" alt="Placeholder photo: a group gathered for a workshop" width="1400" height="1050" loading="lazy" decoding="async">
      </figure>
      <figure class="event-photo">
        <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" alt="Placeholder photo: a shared worktable with laptops and notebooks" width="1400" height="1050" loading="lazy" decoding="async">
      </figure>
      <figure class="event-photo">
        <img src="https://images.unsplash.com/photo-1505373877841-8d25f7d46678?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" alt="Placeholder photo: an audience attending a presentation" width="1400" height="1050" loading="lazy" decoding="async">
      </figure>
      <figure class="event-photo">
        <img src="https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" alt="Placeholder photo: people sharing a meal around a table" width="1400" height="1050" loading="lazy" decoding="async">
      </figure>
    </section>
  </main>
  <footer class="site-footer">nocodesociety 2026</footer>
  <dialog id="about" aria-labelledby="about-title">
    <button class="close-dialog" id="about-close" aria-label="Close about dialog">×</button>
    <img class="about-logo" src="assets/no-code-society-logo.png" alt="No Code Society logo" width="180" height="180">
    <p class="eyebrow">NCS</p>
    <h2 id="about-title">No Code Society</h2>
    <button class="wander-button" id="about-done">Close <span aria-hidden="true">↗</span></button>
  </dialog>
  <dialog class="photo-viewer" id="photo-viewer" aria-label="Event photo viewer">
    <button class="viewer-close" type="button" aria-label="Close photo viewer" autofocus>×</button>
    <button class="viewer-arrow viewer-previous" type="button" aria-label="Previous photo">←</button>
    <img class="viewer-image" alt="">
    <button class="viewer-arrow viewer-next" type="button" aria-label="Next photo">→</button>
    <span class="viewer-count" role="status" aria-live="polite"></span>
  </dialog>
</body>
</html>
